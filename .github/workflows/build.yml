name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: |
          go build -ldflags "-s -w" -o http-proxy.exe main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: http-proxy-windows-amd64
          path: http-proxy.exe